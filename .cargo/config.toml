[env]
# ts-rs: `cargo test` regenerates the TypeScript bindings for every
# `#[ts(export)]` type into the frontend, keeping the API/SSE contract
# in sync with the Rust structs.
TS_RS_EXPORT_DIR = { value = "frontend/src/lib/generated", relative = true }
# serde_json serializes i64 as a JSON number, so bind i64/u64 to `number`
# (GitHub database ids fit comfortably in 2^53).
TS_RS_LARGE_INT = "number"
